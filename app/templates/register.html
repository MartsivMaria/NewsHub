{% extends "base.html" %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <h1>Створити акаунт</h1>
        <p>Приєднуйтеся до спільноти NewsHub</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="auth-message {{ category }}">
            {{ message }}
        </div>
        {% endfor %}
        {% endwith %}

        <form method="POST">
            <label for="username">Ім'я користувача</label>
            <input id="username" type="text" name="username" required maxlength="80" autocomplete="username">

            <label for="email">Електронна пошта</label>
            <input id="email" type="email" name="email" required maxlength="120" autocomplete="email">

            <label for="password">Пароль</label>
            <input id="password" type="password" name="password" required minlength="8" autocomplete="new-password">

            <button type="submit">Зареєструватися</button>
        </form>

        <p>
            Уже маєте акаунт?
            <a href="{{ url_for('login') }}">Увійти</a>
        </p>
    </div>
</section>
{% endblock %}
