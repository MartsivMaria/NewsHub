```html
{% extends "base.html" %}

{% block content %}
<section class="admin-dashboard">
    <h1>Додавання новини</h1>
    <p>Заповніть інформацію про нову публікацію.</p>

    <form method="POST" class="article-form">

        <label for="title">Назва новини</label>
        <input type="text" id="title" name="title" maxlength="200" required>

        <label for="description">Короткий опис</label>
        <textarea id="description" name="description" maxlength="500" required></textarea>

        <label for="content">Повний текст новини</label>
        <textarea id="content" name="content" rows="10" required></textarea>

        <label for="author">Автор</label>
        <input type="text" id="author" name="author" maxlength="120" required>

        <label for="image">Посилання на зображення</label>
        <input type="url" id="image" name="image">

        <label for="category_id">Категорія</label>
        <select id="category_id" name="category_id" required>
            <option value="">Оберіть категорію</option>

            {% for category in categories %}
            <option value="{{ category.id }}">
                {{ category.name }}
            </option>
            {% endfor %}
        </select>

        <div class="article-options">
            <label>
                <input type="checkbox" name="is_breaking">
                Термінова новина (Breaking News)
            </label>
        
            <label>
                <input type="checkbox" name="is_exclusive">
                Ексклюзивна новина (Exclusive)
            </label>
        </div>

        <button type="submit" class="header-button">
            Додати новину
        </button>

        <a href="{{ url_for('admin_articles') }}" class="header-button">
            Скасувати
        </a>

    </form>
</section>
{% endblock %}
```
